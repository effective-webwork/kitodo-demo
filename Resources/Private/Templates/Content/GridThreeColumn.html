<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
     xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
     xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
     xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers">

    <f:layout name="Content"/>

    <f:section name="Configuration">
        <flux:form id="gridThreeColumns" label="33/33/33" description="Grid with 3 columns (33%|33%|33%)">
        </flux:form>

        <flux:grid>
            <flux:grid.row>
                <flux:grid.column colPos="0" colspan="1" name="columnLeft" label="Column left "/>
                <flux:grid.column colPos="1" colspan="1" name="columnMiddle" label="Column middle"/>
                <flux:grid.column colPos="2" colspan="1" name="columnRight" label="Column right"/>
            </flux:grid.row>
        </flux:grid>

    </f:section>

    <f:section name="Preview">
    </f:section>

    <f:section name="Main">
        <div class="grid-wrapper-3-column">
            <div class="col-1-3">
                <flux:content.render area="columnLeft"/>
            </div>
            <div class="col-2-3">
                <flux:content.render area="columnMiddle"/>
            </div>
            <div class="col-3-3">
                <flux:content.render area="columnRight"/>
            </div>
        </div>
    </f:section>

</div>
