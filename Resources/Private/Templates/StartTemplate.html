<f:layout name="DefaultLayout" />

<f:section name="Header">
    <header class="header-portal-home">
        <section class="portal-meta">

            <article class="portal-logo">
                <img src="{f:uri.resource(path: 'Images/mob-logo.png', extensionName: 'presentation_package')}" alt="Martin-Opitz-Bibliothek">
            </article>

            <f:render partial="Breadcrumb" arguments="{_all}"/>

            <article class="meta-navigation">
                <f:format.raw>{contentBasket}</f:format.raw>
            </article>

        </section>

        <section class="portal-home-intro">

            <article class="portal-claim">
                Digitalisierte Bestände der <strong>Martin-Opitz-Bibliothek</strong> durchsuchen
            </article>

        </section>


        <f:format.raw>{contentHeader}</f:format.raw>

    </header>
</f:section>

<f:section name="Main">
    <main>
        <section>
            <f:format.raw>{contentMain}</f:format.raw>
        </section>
        <section>
            <ul class="tx-dlf-collection-list">
                <f:for each="{collectionMenu}" as="item">
                    <li>
                        <h2>
                            <f:link.page pageUid="{item.data.uid}" title="{item.title}">{item.title}</f:link.page>
                        </h2>
                        <div class="tx-dlf-collection-thumbnail">
                            <f:if condition="{item.media.0}">
                                <f:link.page pageUid="{item.data.uid}" title="{item.title}">
                                    <f:image image="{item.media.0}" alt="{item.title}" title="{item.media.0.title}" />
                                </f:link.page>
                            </f:if>
                        </div>
                        <p>{item.data.abstract}</p>
                    </li>
                </f:for>
            </ul>
        </section>
    </main>
</f:section>
