<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
     xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
     xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
     xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
     xmlns:pp="http://typo3.org/ns/Kitodo/PresentationPackage/ViewHelpers">

    <f:layout name="Default" />

    <f:section name="Configuration">
        <flux:form id="digitalisateStartpage" label="Digitalisate Startseite">
            <!-- Insert fields, sheets, grid, form section objects etc. here, in this flux:form tag -->
        </flux:form>

        <flux:grid>
            <!-- Edit this grid to change the "backend layout" structure -->
            <flux:grid.row>
                <flux:grid.column colPos="0" colspan="2" name="Search" label="Suche">
                </flux:grid.column>
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="2" colspan="2" name="Statistik" label="Statistik">
                </flux:grid.column>
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="1" colspan="2" name="Main" label="Main">
                </flux:grid.column>
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="3" colspan="2" name="Teaser" label="Teaser Elemente">
                </flux:grid.column>
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="4" colspan="2" name="Info" label="Zusatzinfo">
                </flux:grid.column>
            </flux:grid.row>
        </flux:grid>
    </f:section>

    <f:section name="Main">
        <pp:menuHeaderSync />
        <f:render partial="DigitalisateHeader" arguments="{_all}"/>

        <header class="header-portal-home" style="background:url({f:uri.resource(path: 'Images/ph-background.jpg')}) no-repeat top center #242424;background-size: cover;">
            <section class="portal-meta">

                <article class="breadcrumb">
                    <a href="">Digitalisierte Bestände</a>
                </article>

                <!--<article class="meta-navigation">
                    <a href="" title="favorites"><img src="{f:uri.resource(path: 'img/icon-star.svg')}" alt="favorites" /><span class="meta-batchcount">11</span></a>
                </article>-->

            </section>

            <section class="portal-home-intro">

                <article class="portal-logo">
                    Digitalisierte Bestände
                </article>
                <article class="portal-claim">
                    Drucke, Handschriften, Karten, Fotos und mehr –<br/> durchsuchen Sie die Kollektionen der Stabi
                </article>

            </section>

            <section class="home-tx-dlf-search tx-dlf-search clear">
                <v:content.render column="0" />
            </section>

            <section class="tx-dlf-statistics-wrapper">
                <v:content.render column="1" />
            </section>

        </header>

        <main>
            <div class="tx-dlf-collection">
                <v:page.menu entryLevel="0" expandAll="0" levels="0" showHiddenInMenu="1">
                    <f:for each="{menu}" as="mainItem">
                        <v:page.menu pageUid="{mainItem.uid}" expandAll="0" levels="1" useShortcutUid="1">
                            <ul class="tx-dlf-collection-list">
                                <f:for each="{menu}" as="item">
                                    <li>
                                        <div class="tx-dlf-collection-thumbnail">
                                            <v:page.resources.fal table="pages" field="media" uid="{item.uid}" as="images" slide="-1" >
                                                <f:for each="{images}" as="image">
                                                    <v:page.link
                                                            pageUid="{item.uid}"
                                                            title="{item.linktext}"
                                                            class="{itemClass}"
                                                            target="{itemTarget}">
                                                        <f:image src="{image.url}" alt="{item.linktext}" title="{image.title}" />
                                                    </v:page.link>
                                                </f:for>
                                            </v:page.resources.fal>
                                        </div>

                                        <h2>
                                            <v:page.link
                                                    pageUid="{item.uid}"
                                                    title="{item.linktext}"
                                                    class="{itemClass}"
                                                    target="{itemTarget}">
                                                {item.linktext}
                                            </v:page.link>
                                        </h2>
                                    </li>
                                </f:for>
                            </ul>
                        </v:page.menu>
                    </f:for>
                </v:page.menu>
            </div>

            <f:render partial="DigitalisateTeaserSlot"/>

            <section class="hero-teaser">

            </section>

            <div class="legal-info clear">
                <v:content.render column="4" />
            </div>

        </main>

        <f:render partial="DigitalisateFooter"/>

    </f:section>

</div>
