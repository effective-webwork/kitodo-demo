<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:kitodo="http://typo3.org/ns/Kitodo/Dlf/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>

    LICENSE.txt file that was distributed with this source code.
</f:comment>

<f:variable name="navigationPage" value="{requestData.page + 1 + requestData.double}" />

<li class="tx-dlf-navigation-next">
    <f:if condition="{pageForwardActive}">
        <f:then>
            <kitodo:link requestData="{requestData}" additionalParams="{'page':'{navigationPage}'}" excludedParams="{0: 'measure'}">
                <img src="{f:uri.resource(path: 'Images/icon-arrow-right.svg', extensionName: 'PresentationPackage')}" alt="{f:translate(key: 'navigation.page.nextPage')}">
            </kitodo:link>
        </f:then>
        <f:else>
            <span title="{f:translate(key: 'navigation.page.nextPage')}">
                <img src="{f:uri.resource(path: 'Images/icon-arrow-right.svg', extensionName: 'PresentationPackage')}" alt="{f:translate(key: 'navigation.page.nextPage')}">
            </span>
        </f:else>
    </f:if>
</li>

</html>
