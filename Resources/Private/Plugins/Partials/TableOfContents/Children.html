<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:kitodo="http://typo3.org/ns/Kitodo/Dlf/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:for each="{children}" as="child">
    <f:switch expression="{child.ITEM_STATE}">
        <f:case value="ACT">
            <li class="tx-dlf-tableofcontents-active">
                <div class="toc-entry">
        </f:case>
        <f:case value="CUR">
            <li class="tx-dlf-tableofcontents-current">
                <div class="toc-entry">
        </f:case>
        <f:case value="ACTIFSUB">
            <li class="tx-dlf-tableofcontents-active tx-dlf-tableofcontents-submenu">
                <div class="toc-entry">
                <span class="toggle">-</span>
        </f:case>
        <f:case value="CURIFSUB">
            <li class="tx-dlf-tableofcontents-current tx-dlf-tableofcontents-submenu">
                <div class="toc-entry">
                <span class="toggle">-</span>
        </f:case>
        <f:case value="IFSUB">
            <li class="tx-dlf-tableofcontents-no tx-dlf-tableofcontents-submenu">
                <div class="toc-entry">
                <span class="toggle">+</span>
        </f:case>
        <f:defaultCase>
            <li class="tx-dlf-tableofcontents-no">
                <div class="toc-entry">
        </f:defaultCase>
    </f:switch>

    <f:if condition="{child.doNotLinkIt}">
        <f:then>
            <f:render partial="TableOfContents/Title" arguments="{child: child}"/>
        </f:then>
        <f:else>
            <kitodo:link
                requestData="{requestData}"
                pageUid="{settings.targetPid}"
                additionalParams="{f:if(condition:'{child.id}', then:'{\'id\':child.id, \'page\':child.page}', else: '{\'page\':child.page}')}"
                excludedParams="{0: 'measure', 1: 'multiview'}"
                section="{child.section}"
                title="{f:if(condition:'{child.title}', then: '{child.title}', else: '{child.type}')}">
                    <f:render partial="TableOfContents/Title" arguments="{child: child}"/>
            </kitodo:link>
        </f:else>
    </f:if>

    <div class="tx-dlf-metadata-hidden tx-dlf-metadata-log_id" id="{child.basketButton.logId}"></div>
    <f:if condition="{settings.basketButton} && {settings.targetBasket}">
        <span class="tx-dlf-basket-button">
                <f:link.action
                    pageUid="{settings.targetBasket}"
                    action="main"
                    controller="Basket"
                    additionalParams="{'tx_dlf[addToBasket]':'toc', 'tx_dlf[logId]':child.basketButton.logId, 'tx_dlf[startpage]':child.basketButton.startpage, 'tx_dlf_basket[action]':'add', 'tx_dlf_basket[controller]':'Basket'}"
                    addQueryString="untrusted">
                        <f:translate key="basket.addBasket" />
                </f:link.action>
        </span>
    </f:if>
    </div>

    <f:if condition="{child._SUB_MENU} && ({child.ITEM_STATE} == 'IFSUB' || {child.ITEM_STATE} == 'ACTIFSUB' || {child.ITEM_STATE} == 'CURIFSUB')">
        <ul>
            <f:render partial="TableOfContents/Children" arguments="{children: child._SUB_MENU, requestData: requestData}"/>
        </ul>
    </f:if>

    </li>
</f:for>

</html>
