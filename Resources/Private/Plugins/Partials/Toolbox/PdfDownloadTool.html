<li class="tx-button">
    <span class="tx-dlf-tools-pdf-page">
        <f:if condition="{double} === 0">
            <f:then>
                <f:if condition="{pageLinks.0}">
                    <f:then><f:link.external uri="{pageLinks.0}" class="fa fa-lg fa-file-pdf" aria="{label: '{f:translate(key: \'toolbox.general.downloadSinglePage\')} (PDF)'}"></f:link.external></f:then>
                    <f:else><span class="fa fa-lg fa-file-pdf" aria-hidden="true"></span></f:else>
                </f:if>
            </f:then>
            <f:else>
                <f:if condition="{pageLinks.0}">
                    <f:then><f:link.external uri="{pageLinks.0}" class="fa fa-lg fa-file-pdf" aria="{label: '{f:translate(key: \'toolbox.general.downloadLeftPage\')} (PDF)'}"></f:link.external></f:then>
                    <f:else><span class="fa fa-lg fa-file-pdf" aria-hidden="true"></span></f:else>
                </f:if>
                <f:if condition="{pageLinks.1}">
                    <f:link.external uri="{pageLinks.1}" class="fa fa-lg fa-file-pdf" aria="{label: '{f:translate(key: \'toolbox.general.downloadRightPage\')} (PDF)'}"></f:link.external>
                </f:if>
            </f:else>
        </f:if>
    </span>
    <span class="tx-dlf-tools-pdf-work">
        <f:if condition="{workLink}">
            <f:link.external uri="{workLink}" class="fa fa-lg fa-file-pdf" aria="{label: '{f:translate(key: \'toolbox.pdfDownload.downloadWork\')} (PDF)'}"></f:link.external>
        </f:if>
    </span>
</li>
<li class="tx-button" style="display:none;">
    <a id="fullPdfDownload" href="#" class="fa fa-lg fa-file-pdf"></a>
</li>

</html>
