<li class="tx-dlf-tools-rotate-left">
    <f:variable name="rotateLeft"><f:translate key="toolbox.rotate.left"/></f:variable>
    <a href="#" title="{rotateLeft}" onclick="tx_dlf_viewer.map.rotateLeft();">
        <img src="{f:uri.resource(path: 'Images/icon-rotateleft.svg', extensionName: 'PresentationPackage')}" alt="{rotateLeft}">
    </a>
</li>
<li class="tx-dlf-tools-rotate-right">
    <f:variable name="rotateRight"><f:translate key="toolbox.rotate.right"/></f:variable>
    <a href="#" title="{rotateRight}" onclick="tx_dlf_viewer.map.rotateRight();">
        <img src="{f:uri.resource(path: 'Images/icon-rotateright.svg', extensionName: 'PresentationPackage')}" alt="{rotateRight}">
    </a>
</li>
<f:comment>
    <li class="tx-dlf-tools-rotate-reset">
        <f:variable name="rotateReset"><f:translate key="toolbox.rotate.reset"/></f:variable>
        <a href="#" title="{rotateReset}" onclick="tx_dlf_viewer.map.resetRotation();">{rotateReset}</a>
    </li>
</f:comment>

</html>
