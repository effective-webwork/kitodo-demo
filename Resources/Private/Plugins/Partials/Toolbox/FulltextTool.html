<li class="tx-dlf-tools-fulltext">

        <f:then>
            <a class="select switchoff" id="tx-dlf-tools-fulltext" title="" data-dic="fulltext:;fulltext-loading:;fulltext-on:;fulltext-off:;activate-full-text-initially:{activateFullTextInitially};full-text-scroll-element:{settings.fullTextScrollElement};search-hl-parameters:{settings.searchHlParameters}"></a>
        </f:then>
        <f:else>
            <span class="tx-dlf-tools-fulltext-not-available"><img src="{f:uri.resource(path:'EXT:presentation_package/Resources/Public/Images/icon-text-white.svg')}" alt="{f:translate(key: 'toolbox.fulltext.notAvailable')}"></span>
