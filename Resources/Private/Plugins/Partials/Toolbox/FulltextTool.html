<li class="tx-dlf-tools-fulltext">
    <f:if condition="{fulltext}">
        <f:then>
            <a class="select switchoff" id="tx-dlf-tools-fulltext" title="{f:translate(key: 'toolbox.fulltext')}" data-dic="fulltext:{f:translate(key: 'toolbox.fulltext')};fulltext-loading:{f:translate(key: 'toolbox.fulltext.loading')};fulltext-on:{f:translate(key: 'toolbox.fulltext.on')};fulltext-off:{f:translate(key: 'toolbox.fulltext.off')};activate-full-text-initially:{activateFullTextInitially};full-text-scroll-element:{settings.fullTextScrollElement};search-hl-parameters:{settings.searchHlParameters}">
                <img src="{f:uri.resource(path: 'Images/icon-text-white.svg', extensionName: 'PresentationPackage')}" alt="{f:translate(key: 'toolbox.fulltext')}">
            </a>
        </f:then>
        <f:else>
            <span class="tx-dlf-tools-fulltext-not-available">
                <img src="{f:uri.resource(path: 'Images/icon-text-white.svg', extensionName: 'PresentationPackage')}" alt="{f:translate(key: 'toolbox.fulltext.notAvailable')}">
            </span>
        </f:else>
    </f:if>
</li>

</html>
