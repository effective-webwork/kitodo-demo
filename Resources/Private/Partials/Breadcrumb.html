<article class="breadcrumb">
    <f:for each="{breadcrumbMenu}" as="item" iteration="iteratorItem">
        <f:if condition="{iteratorItem.isFirst} == 0">
            <f:then> / </f:then>
        </f:if>
        <f:if condition="{iteratorItem.isLast}">
            <f:then>
                <span>{item.title}</span>
            </f:then>
            <f:else>
                <a href="{item.link}" class="fade">{item.title}</a>
            </f:else>
        </f:if>
    </f:for>
</article>
